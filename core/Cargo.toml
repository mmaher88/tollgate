[workspace]
resolver = "3"
members = ["crates/tollgate-ffi", "tools/uniffi-bindgen-swift"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"
publish = false

[workspace.dependencies]
uniffi = "0.32.2"
ring = "0.17.14"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
